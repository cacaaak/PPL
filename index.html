<title>PPL di Rumah</title>
<style>
:root{--bg:#eef2f0;--card:#fff;--ink:#14231e;--mute:#5d6f68;--line:#d5dfdb;--acc:#0f6b5c;--accsoft:#d9efe9;--on:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1815;--card:#18251f;--ink:#e8f1ed;--mute:#93a79f;--line:#2a3b34;--acc:#3ec9ac;--accsoft:#1c3a32;--on:#08120f}}
:root[data-theme="dark"]{--bg:#0f1815;--card:#18251f;--ink:#e8f1ed;--mute:#93a79f;--line:#2a3b34;--acc:#3ec9ac;--accsoft:#1c3a32;--on:#08120f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 "Trebuchet MS","Segoe UI",system-ui,sans-serif}
main{max-width:520px;margin:0 auto;padding:16px 16px 110px}
h1{font-size:26px;margin:4px 0 2px;letter-spacing:-.5px}
.sub{color:var(--mute);margin:0 0 14px;font-size:14px}
.week{display:flex;gap:6px;margin-bottom:14px}
.week button{flex:1;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:7px 0;font:inherit;font-size:12px;cursor:pointer}
.week button b{display:block;font-size:14px}
.week button.sel{background:var(--acc);color:var(--on);border-color:var(--acc)}
.week button.today{outline:2px solid var(--acc);outline-offset:1px}
.bar{height:8px;background:var(--line);border-radius:8px;overflow:hidden;margin:6px 0 16px}
.bar i{display:block;height:100%;width:0;background:var(--acc);transition:width .3s}
.ex{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.ex.done{border-color:var(--acc);background:var(--accsoft)}
.ex h3{margin:0;font-size:17px}
.ex p{margin:2px 0 10px;color:var(--mute);font-size:13px}
.sets{display:flex;gap:8px;flex-wrap:wrap}
.sets button{width:46px;height:46px;border-radius:50%;border:2px solid var(--acc);background:transparent;color:var(--acc);font:inherit;font-weight:700;cursor:pointer}
.sets button.on{background:var(--acc);color:var(--on)}
button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.how{margin-top:10px;background:none;border:none;color:var(--acc);font:inherit;font-size:14px;font-weight:700;cursor:pointer;padding:4px 0}
.guide{margin-top:8px;padding:10px 12px;background:var(--bg);border-radius:10px;font-size:14px}
.guide ol{margin:0 0 8px;padding-left:20px}.guide a{color:var(--acc);font-weight:700}
.rest{text-align:center;padding:30px 10px;color:var(--mute)}
.tips{font-size:13px;color:var(--mute);margin-top:16px;line-height:1.6}
.reset{background:none;border:none;color:var(--mute);text-decoration:underline;font:inherit;font-size:13px;cursor:pointer;margin-top:8px}
.timer{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:8px;justify-content:center}
.timer .t{font-size:26px;font-weight:700;min-width:70px;text-align:center;font-variant-numeric:tabular-nums}
.timer button{border:1px solid var(--acc);background:transparent;color:var(--acc);border-radius:20px;padding:8px 14px;font:inherit;font-size:14px;cursor:pointer}
.timer .go{background:var(--acc);color:var(--on)}
</style>
</head>
<body>
<main>
  <h1>PPL di Rumah</h1>
  <p class="sub" id="sub"></p>
  <div class="week" id="week"></div>
  <div id="content"></div>
</main>
<div class="timer">
  <button id="t60">60 dtk</button>
  <div class="t" id="tv">0:00</div>
  <button id="t90" class="go">90 dtk</button>
</div>

"Dumbbell floor press":["Berbaring telentang, lutut ditekuk, dumbbell di tiap tangan.","Turunkan sampai siku menyentuh lantai.","Dorong ke atas sampai lengan lurus."],
"Lateral raise":["Berdiri, dumbbell di samping badan, siku sedikit menekuk.","Angkat ke samping sampai setinggi bahu.","Turunkan pelan 2-3 detik, jangan mengayun."],
"Overhead tricep extension":["Pegang satu dumbbell dengan dua tangan di atas kepala.","Tekuk siku, turunkan dumbbell ke belakang kepala.","Luruskan lengan ke atas, siku tetap dekat kepala."],
"Pull-up / chin-up":["Pegang bar, pull-up: telapak menghadap depan; chin-up: menghadap ke arah kamu.","Tarik dada ke bar dengan menarik siku ke bawah.","Turun pelan sampai lengan lurus. Belum kuat? Loncat naik lalu turun 5 detik."],
"One-arm dumbbell row":["Satu tangan dan lutut bertumpu di kursi/kasur, punggung datar.","Tarik dumbbell ke arah pinggul, siku dekat badan.","Turunkan pelan sampai lengan lurus, lalu ganti sisi."],
"Reverse fly":["Membungkuk dari pinggul, punggung datar, dumbbell menggantung.","Angkat kedua lengan ke samping sampai setinggi bahu.","Peras tulang belikat, turunkan pelan."],
"Dumbbell curl":["Berdiri, dumbbell di samping badan, telapak menghadap depan.","Tekuk siku, angkat ke arah bahu tanpa mengayun badan.","Turunkan pelan sampai lengan lurus."],
"Hammer curl":["Sama seperti curl, tapi telapak saling berhadapan (seperti memegang palu).","Angkat ke arah bahu, siku tetap di sisi badan.","Turunkan pelan."],
"Bulgarian split squat":["Kaki belakang bertumpu di kursi, kaki depan melangkah ke depan.","Turunkan badan sampai paha depan sejajar lantai.","Dorong naik lewat tumit kaki depan. Selesaikan satu kaki dulu."],
"Goblet squat":["Pegang dumbbell di depan dada, kaki selebar bahu.","Duduk ke bawah, punggung tegak, lutut searah jari kaki.","Berdiri dengan mendorong lantai lewat tumit."],
"Dumbbell Romanian deadlift":["Berdiri, dumbbell di depan paha, lutut sedikit menekuk.","Dorong pinggul ke belakang, dumbbell meluncur di sepanjang kaki.","Turun sampai paha belakang terasa tertarik, lalu berdiri dengan mendorong pinggul ke depan."],
"Lunges":["Berdiri tegak dengan dumbbell di tiap tangan.","Melangkah ke depan, turunkan lutut belakang hampir menyentuh lantai.","Dorong kembali ke posisi awal, ganti kaki."],

var WEEK=["Rest","Push","Pull","Legs","Push","Pull","Legs"]; // index = getDay() Minggu=0
var NAMES=["Min","Sen","Sel","Rab","Kam","Jum","Sab"];
var openK=null,openName=null,today=new Date().getDay(), sel=today, state={};
function key(){var d=new Date();return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate()}
function load(){try{var s=JSON.parse(localStorage.getItem("ppl-rumah")||"{}");if(s.k===key())state=s.v||{}}catch(e){}}
function save(){try{localStorage.setItem("ppl-rumah",JSON.stringify({k:key(),v:state}))}catch(e){}}
function render(){stopAnim();
  var wk=document.getElementById("week");wk.innerHTML="";
  NAMES.forEach(function(n,i){var b=document.createElement("button");b.innerHTML=n+"<b>"+WEEK[i][0]+"</b>";
    if(i===sel)b.className="sel";if(i===today)b.className+=" today";
    b.onclick=function(){sel=i;render()};wk.appendChild(b)});
  var day=WEEK[sel],c=document.getElementById("content");
  document.getElementById("sub").textContent=(sel===today?"Hari ini":"Hari "+NAMES[sel])+": "+(day==="Rest"?"istirahat":day);
  if(day==="Rest"){c.innerHTML='<div class="rest">Hari istirahat. Otot tumbuh saat pulih, jadi tidur cukup dan makan protein.</div>';return}
  var list=PLAN[day],total=0,done=0;
  var html='<div class="bar"><i id="pb"></i></div>';
  list.forEach(function(e,ei){
    var k=day+ei,got=state[k]||[],all=got.filter(Boolean).length===e[2];total+=e[2];done+=got.filter(Boolean).length;
    html+='<div class="ex'+(all?" done":"")+'"><h3>'+e[0]+'</h3><p>'+e[2]+' set · '+e[1]+'</p><div class="sets">';
    for(var s=0;s<e[2];s++)html+='<button data-k="'+k+'" data-s="'+s+'" class="'+(got[s]?"on":"")+'" aria-label="Set '+(s+1)+'">'+(s+1)+'</button>';
    var op=openK===k;
    html+='</div><button class="how" data-h="'+k+'" data-n="'+ei+'">'+(op?"Tutup panduan":"Lihat cara gerakan")+'</button>';
    if(op){var st=HOW[e[0]]||[];html+='<div class="guide">'+fig(e[0])+'<ol>'+st.map(function(x){return"<li>"+x+"</li>"}).join("")+'</ol><a href="https://www.youtube.com/results?search_query='+encodeURIComponent(e[0]+" tutorial")+'" target="_blank" rel="noopener">Cari video di YouTube</a></div>'}
    html+='</div>';
  });

  c.innerHTML=html;if(openK)play(openName);

  c.querySelectorAll(".sets button").forEach(function(b){b.onclick=function(){
    var k=b.dataset.k,s=+b.dataset.s;state[k]=state[k]||[];state[k][s]=!state[k][s];save();

  c.querySelectorAll(".how").forEach(function(b){b.onclick=function(){openK=openK===b.dataset.h?null:b.dataset.h;openName=list[+b.dataset.n][0];render()}});
  document.getElementById("rs").onclick=function(){list.forEach(function(e,i){delete state[day+i]});save();render()};
}
